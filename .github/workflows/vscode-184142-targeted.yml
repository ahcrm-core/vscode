name: VS Code 184142 targeted verification

on:
  push:
    branches:
      - test/184142-targeted-ci
    paths:
      - .github/workflows/vscode-184142-targeted.yml
      - src/vs/workbench/api/browser/mainThreadCustomEditors.ts
      - src/vs/workbench/api/test/browser/mainThreadCustomEditors.test.ts
      - src/vs/workbench/services/extensions/common/abstractExtensionService.ts
      - src/vs/workbench/services/extensions/common/extensions.ts
      - src/vs/workbench/services/extensions/test/browser/extensionService.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix build ci --ignore-scripts --no-audit --no-fund
      - name: Fetch matching Electron and type declarations
        run: |
          node build/npm/electronTypes.ts
          npm run electron
      - name: Typecheck and transpile
        run: |
          npm run typecheck-client
          npm run transpile-client
      - name: Run both focused suites
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          VSCODE_SKIP_PRELAUNCH: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a ./scripts/test.sh --run src/vs/workbench/api/test/browser/mainThreadCustomEditors.test.ts --run src/vs/workbench/services/extensions/test/browser/extensionService.test.ts --timeout 20000
